<nz-alert
  *ngIf="isError && error.length != 0"
  nzType="error"
  [nzMessage]="error"
  nzShowIcon
></nz-alert>
<button nz-button [nzType]="'primary'" (click)="bayPlotShowModal()">
  <span>船图</span>
</button>
<nz-modal
  [(nzVisible)]="bayPlotIsVisible"
  nzTitle="选择预配id"
  (nzOnCancel)="bayPlotHandleCancel()"
  (nzOnOk)="bayPlotHandleOk()"
  [nzFooter]="null"
>
  <ng-container *nzModalContent>
    <nz-input-group nzSearch nzSize="large">
      <input
        type="text"
        nz-input
        placeholder="请输入预配id"
        [formControl]="pIdInput"
      />
    </nz-input-group>

    <p></p>
    <!-- 显示船贝图的按钮和drawer的属性 -->
    <nz-space nzAlign="center" [nzSize]="'middle'">
      <button
        *nzSpaceItem
        nz-button
        [nzType]="'primary'"
        (click)="pIdShowModal()"
      >
        <span>查看预配id信息</span>
      </button>
      <button *nzSpaceItem nz-button nzType="primary" (click)="DrawerShow()">
        显示船贝图
      </button>
    </nz-space>
    <!-- 展示预配id及其对应的数据 -->
    <nz-modal
      [(nzVisible)]="PidisVisible"
      nzTitle="预配id信息展示"
      (nzOnCancel)="modelhandleCancel()"
      (nzOnOk)="modelhandleOk()"
      nzWidth="800px"
    >
      <ng-container *nzModalContent>
        <nz-spin [nzSpinning]="isLoading" nzTip="正在加载...">
        <nz-table
          #basicTable
          [nzData]="pIdList"
          [nzTotal]="pIdCount"
          [nzFrontPagination]="false"
          [(nzPageSize)]="pIdPageSize"
          [(nzPageIndex)]="pIdPageIndex"
          (nzPageIndexChange)="onPIdPageIndexChange()"
          (nzPageSizeChange)="onPIdPageSizeChange()"
          [nzShowTotal]="pidtotalTemplate"
          nzShowPagination
          nzShowSizeChanger
          [nzPageSizeOptions]="[5, 10, 20, 30, 50, 100, 200]"
        >
          <thead>
            <tr>
              <th>预配id</th>
              <th>数量</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let data of pIdList">
              <td>{{ data.p_id }}</td>
              <td>{{ data.count }}</td>
            </tr>
          </tbody>
        </nz-table>
        </nz-spin>

        <ng-template #pidtotalTemplate let-total>共{{ pIdCount }}</ng-template>
      </ng-container>
    </nz-modal>
    <nz-drawer
      [nzSize]="size"
      nzWidth="1000px"
      [nzVisible]="drawerVisible"
      nzPlacement="right"
      [nzTitle]="title"
      [nzExtra]="extra"
      (nzOnClose)="drawerClose()"
    >
      <ng-container *nzDrawerContent>
        <div class="bay-container">
          <div *ngFor="let vesselBay of vesselBayDatas; let i = index">
            <div class="bay-group" *ngFor="let bay of vesselBay">
              <app-vessel-bay [vesselBayData]="bay"></app-vessel-bay>
            </div>
          </div>
        </div>
      </ng-container>
    </nz-drawer>

    <ng-template #extra>
      <button nz-button nzType="default" (click)="drawerClose()">Cancel</button>
      &nbsp;
      <button nz-button nzType="primary" (click)="drawerClose()">OK</button>
    </ng-template>
  </ng-container>
</nz-modal>
